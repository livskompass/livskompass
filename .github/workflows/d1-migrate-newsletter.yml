name: "D1 migration: newsletter_signups table"

# One-off, manually triggered migration. Additive only — CREATE TABLE IF NOT
# EXISTS touches nothing existing. Uses the same Cloudflare token as deploys.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Create newsletter_signups table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          npx wrangler d1 execute livskompass-db --remote --command \
            "CREATE TABLE IF NOT EXISTS newsletter_signups (id TEXT PRIMARY KEY, email TEXT UNIQUE NOT NULL, source TEXT, created_at TEXT DEFAULT (datetime('now')))"
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
